# Self-hosted Hyperion: the server (with dashboard and overlay) plus Postgres, and optionally Caddy for HTTPS.
# Step-by-step guide: docs/SELF_HOSTING.md. In short, put POSTGRES_PASSWORD and SECRETS_KEY in .env, plus DOMAIN and
# COMPOSE_PROFILES=https for automatic HTTPS, then either use the published image:
#   docker compose -f docker/compose.yml --env-file .env pull && docker compose -f docker/compose.yml --env-file .env up -d
# or build it from this checkout:
#   docker compose -f docker/compose.yml --env-file .env up -d --build
name: hyperion-selfhost
services:
  hyperion:
    # Pulled from GitHub's registry, or built from this checkout with --build. HYPERION_VERSION pins a release.
    image: ghcr.io/dawitmek/hyperion:${HYPERION_VERSION:-latest}
    build:
      context: ..
      # WITH_PIPER=true in .env adds Piper voices to an image you build yourself (up -d --build).
      args:
        WITH_PIPER: ${WITH_PIPER:-false}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hyperion:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/hyperion
      EULER_API_KEY: ${EULER_API_KEY:-}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -base64 32)}
      TIKTOK_SESSION_ID: ${TIKTOK_SESSION_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-true}
      # Links in emails use PUBLIC_URL, or https://DOMAIN without it.
      DOMAIN: ${DOMAIN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${HYPERION_BIND:-127.0.0.1}:${HYPERION_PORT:-3000}:3000"

  # Only with COMPOSE_PROFILES=https. Gets and renews a certificate for DOMAIN by itself.
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - hyperion
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hyperion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy-data:
